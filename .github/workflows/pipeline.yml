# Pipeline de calidad de QA Agentic Lab.
# Cada job ejecuta una etapa con el MISMO comando que se usa en local (npm run qa -- --stage <id>): este fichero no
# contiene lógica de pruebas (QA-003). No usa ningún secreto: cualquiera puede lanzarlo desde la pestaña Actions.
name: Pipeline de calidad

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      defecto:
        description: Defecto que se inyecta en la tienda para la demostración (QA-029). Una ejecución con defecto no se publica.
        type: choice
        default: ninguno
        options: [ninguno, cupon, selector, caida]
  schedule:
    - cron: '30 5 * * *' # cada día a las 05:30 UTC

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Vacío salvo en una ejecución manual con defecto: la tienda solo lo activa con esta variable (QA-029).
  QA_INJECT_DEFECT: ${{ github.event_name == 'workflow_dispatch' && inputs.defecto != 'ninguno' && inputs.defecto || '' }}
  QA_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
  QA_REPORT_URL: ${{ github.ref == 'refs/heads/main' && format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) || format('{0}/{1}/actions/runs/{2}#artifacts', github.server_url, github.repository, github.run_id) }}

jobs:
  static:
    name: 1 · Análisis estático
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Gitleaks revisa todo el historial
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Navegador para validar los diagramas Mermaid
        run: npx playwright install --with-deps chromium
      - name: Instalar Gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm run qa -- --stage static
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: partial-static
          path: |
            reports/runs/${{ env.QA_RUN_ID }}/meta.json
            reports/runs/${{ env.QA_RUN_ID }}/stages/static.json
          if-no-files-found: ignore

  build:
    name: 2 · Tienda en el runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run qa -- --stage build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: partial-build
          path: |
            reports/runs/${{ env.QA_RUN_ID }}/meta.json
            reports/runs/${{ env.QA_RUN_ID }}/stages/build.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-build
          include-hidden-files: true
          path: |
            .next
            !.next/cache
          retention-days: 1

  e2e:
    name: 3 · Smoke y E2E
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-build
          path: .next
      - run: npm run qa -- --stage e2e
        env:
          QA_REUSE_BUILD: '1' # usa la build del job anterior en lugar de repetirla
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: partial-e2e
          path: |
            reports/runs/${{ env.QA_RUN_ID }}/meta.json
            reports/runs/${{ env.QA_RUN_ID }}/stages/e2e.json
            reports/runs/${{ env.QA_RUN_ID }}/e2e-tests.json
            reports/runs/${{ env.QA_RUN_ID }}/playwright-report/
          if-no-files-found: ignore

  performance:
    name: 4 · Rendimiento y carga
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Navegador para Lighthouse
        run: npx playwright install --with-deps chromium
      - name: Instalar k6
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz \
            | tar -xz --strip-components=1 -C "$HOME/.local/bin" k6-v2.3.0-linux-amd64/k6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-build
          path: .next
      - run: npm run qa -- --stage performance
        env:
          QA_REUSE_BUILD: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: partial-performance
          path: |
            reports/runs/${{ env.QA_RUN_ID }}/meta.json
            reports/runs/${{ env.QA_RUN_ID }}/stages/performance.json
          if-no-files-found: ignore

  security:
    name: 5 · Seguridad y cumplimiento
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Instalar Semgrep
        run: pipx install semgrep
      - name: Descargar la imagen de OWASP ZAP
        run: docker pull ghcr.io/zaproxy/zaproxy:stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-build
          path: .next
      - run: npm run qa -- --stage security
        env:
          QA_REUSE_BUILD: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: partial-security
          path: |
            reports/runs/${{ env.QA_RUN_ID }}/meta.json
            reports/runs/${{ env.QA_RUN_ID }}/stages/security.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidencias-seguridad
          path: |
            reports/runs/${{ env.QA_RUN_ID }}/sbom.cdx.json
            reports/runs/${{ env.QA_RUN_ID }}/semgrep.json
            reports/runs/${{ env.QA_RUN_ID }}/zap/zap.json
          if-no-files-found: ignore

  report:
    name: 6 · Informe
    needs: [static, build, e2e, performance, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: partial-*
          merge-multiple: true
          path: reports/runs/${{ env.QA_RUN_ID }}
      - name: Traer el histórico público (solo lectura)
        run: |
          mkdir -p reports/history
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git show FETCH_HEAD:history/runs.ndjson > reports/history/runs.ndjson 2>/dev/null || rm -f reports/history/runs.ndjson
          fi
      - run: npm run qa -- --stage report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-report
          path: reports/site/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-result
          path: |
            reports/runs/${{ env.QA_RUN_ID }}/run.json
            reports/runs/${{ env.QA_RUN_ID }}/playwright-report/
          if-no-files-found: ignore

  # Solo main publica el informe y alimenta el histórico público (QA-013). Un PR nunca lo modifica.
  publish:
    name: 7 · Publicar en GitHub Pages
    needs: report
    if: always() && needs.report.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.defecto == 'ninguno')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: run-result
          path: reports/runs/${{ env.QA_RUN_ID }}
      - name: Preparar la rama gh-pages
        run: |
          if git fetch origin gh-pages 2>/dev/null; then
            git worktree add pages FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages pages
          fi
      - run: npx tsx qa/publish.ts pages "reports/runs/${QA_RUN_ID}"
      - name: Subir el informe
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "informe: ejecución #${{ github.run_number }} (${GITHUB_SHA::7})"
          git push origin HEAD:gh-pages
