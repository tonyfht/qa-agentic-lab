name: Preparar el entorno
description: Node 24 y dependencias exactas del lockfile (npm ci), igual en todos los jobs.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: npm
    - run: npm ci
      shell: bash
